name: Integration Test

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU type for the Colab session"
        type: choice
        options:
          - CPU
          - T4
          - L4
          - A100
          - H100
        default: "CPU"
        required: true
      debug:
        description: "Enable debug output"
        type: boolean
        default: false

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install google-colab-cli
        run: |
          uv tool install google-colab-cli --with jupyter-kernel-client==0.9.0

      - name: Install colab-sdk
        run: |
          uv pip install --system -e ".[dev]"

      - name: Create Colab session
        run: |
          if [ "${{ github.event.inputs.gpu }}" != "CPU" ]; then
            colab new -s colab-ci-test --gpu ${{ github.event.inputs.gpu }}
          else
            colab new -s colab-ci-test
          fi

      - name: Run integration test
        run: |
          python examples/integration_test.py
        env:
          COLAB_SESSION_NAME: colab-ci-test
          DEBUG: ${{ github.event.inputs.debug && '1' || '' }}

      - name: Cleanup
        if: always()
        run: |
          colab stop -s colab-ci-test || true
