[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colab-sdk"
version = "0.1.1"
description = "A Python SDK that turns Google Colab into a remote compute runtime."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Colab SDK Contributors"},
]

dependencies = [
    "google-colab-cli>=0.6,<0.7",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/colab"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.urls]
Homepage = "https://github.com/heyncth/colab-client"
Source = "https://github.com/heyncth/colab-client"
